syntax = "proto3";

package pramaan.docreg;

import "google/api/annotations.proto";
import "pramaan/docreg/v1/params.proto";
import "pramaan/docreg/v1/tx.proto";

option go_package = "pramaan/x/docreg/types";

// Query service
service Query {
  rpc GetDocument(QueryGetDocumentRequest) returns (QueryGetDocumentResponse) {
    option (google.api.http).get = "/pramaan/docreg/v1/document/{id}";
  }

  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/pramaan/docreg/v1/params";
  }

  rpc DocumentsByOwner(QueryDocumentsByOwnerRequest) returns (QueryDocumentsByOwnerResponse) {
    option (google.api.http).get = "/pramaan/docreg/v1/documents-by-owner/{owner}";
  }

  rpc DocumentsByIssuer(QueryDocumentsByIssuerRequest) returns (QueryDocumentsByIssuerResponse) {
    option (google.api.http).get = "/pramaan/docreg/v1/documents-by-issuer/{issuer}";
  }

  rpc GetDocumentByHash(QueryGetDocumentByHashRequest) returns (QueryGetDocumentByHashResponse) {
    option (google.api.http).get = "/pramaan/docreg/v1/document-by-hash/{hash}";
  }

  rpc QueryDocuments(QueryDocumentsRequest) returns (QueryDocumentsResponse) {
    option (google.api.http).get = "/pramaan/docreg/v1/documents";
  }
}

// --------------------
// DOCUMENT QUERY
// --------------------

message QueryGetDocumentRequest {
  string id = 1;
}

message QueryGetDocumentResponse {
  Document document = 1;
}

// --------------------
// PARAMS QUERY (REQUIRED)
// --------------------

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1;
}

message QueryDocumentsByOwnerRequest {
  string owner = 1;
}

message QueryDocumentsByOwnerResponse {
  repeated Document documents = 1;
}

// --------------------
// DOCUMENTS BY ISSUER
// --------------------

message QueryDocumentsByIssuerRequest {
  string issuer = 1;
}

message QueryDocumentsByIssuerResponse {
  repeated Document documents = 1;
}

// --------------------
// DOCUMENT BY HASH
// --------------------

message QueryGetDocumentByHashRequest {
  string hash = 1;
}

message QueryGetDocumentByHashResponse {
  Document document = 1;
}

// --------------------
// GENERIC DOCUMENT QUERY
// --------------------

message QueryDocumentsRequest {
  string owner = 1;
  string issuer = 2;
  string type = 3;
  string status = 4;
}

message QueryDocumentsResponse {
  repeated Document documents = 1;
}
