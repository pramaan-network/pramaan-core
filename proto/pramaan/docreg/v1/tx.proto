syntax = "proto3";

package pramaan.docreg;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "pramaan/docreg/v1/params.proto";

option go_package = "pramaan/x/docreg/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterDocument defines the RegisterDocument RPC.
  rpc RegisterDocument(MsgRegisterDocument) returns (MsgRegisterDocumentResponse);

  // TransferDocument defines the TransferDocument RPC.
  rpc TransferDocument(MsgTransferDocument) returns (MsgTransferDocumentResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "pramaan/x/docreg/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message Document {
  string id = 1;
  string hash = 2;
  string owner = 3;
  string issuer = 4;
  string type = 5;
  string status = 6;
  int64 timestamp = 7;
  string metadata = 8;
  string token_type = 9; // "SBT" or "NFT"
  bool transferable = 10; // true/false
}

// MsgRegisterDocument defines the MsgRegisterDocument message.
message MsgRegisterDocument {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  string hash = 3;
  string owner = 4;
  string issuer = 5;
  string doc_type = 6;
  string metadata = 7;
}

// MsgRegisterDocumentResponse defines the MsgRegisterDocumentResponse message.
message MsgRegisterDocumentResponse {}

// MsgTransferDocument defines the MsgTransferDocument message.
message MsgTransferDocument {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  string new_owner = 3;
}

// MsgTransferDocumentResponse defines the MsgTransferDocumentResponse message.
message MsgTransferDocumentResponse {}
