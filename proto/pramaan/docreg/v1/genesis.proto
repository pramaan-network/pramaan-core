syntax = "proto3";
package pramaan.docreg;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "pramaan/docreg/v1/params.proto";
import "pramaan/docreg/v1/tx.proto";

option go_package = "pramaan/x/docreg/types";

// GenesisState defines the docreg module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // documents contains every registered document, needed so state survives export/re-init.
  repeated Document documents = 2;
}
