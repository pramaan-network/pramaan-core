syntax = "proto3";
package pramaan.authority.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "pramaan/authority/v1/authority.proto";
import "pramaan/authority/v1/params.proto";

option go_package = "pramaan/x/authority/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/pramaan/authority/v1/params";
  }
  // Query single authority
  rpc Authority(QueryGetAuthorityRequest) returns (QueryGetAuthorityResponse) {
    option (google.api.http).get = "/pramaan/authority/v1/authority/{address}";
  }

  // Query all authorities
  rpc Authorities(QueryAllAuthoritiesRequest) returns (QueryAllAuthoritiesResponse) {
    option (google.api.http).get = "/pramaan/authority/v1/authorities";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Query single authority
message QueryGetAuthorityRequest {
  string address = 1;
}

message QueryGetAuthorityResponse {
  Authority authority = 1;
}

// Query all authorities
message QueryAllAuthoritiesRequest {}

message QueryAllAuthoritiesResponse {
  repeated Authority authorities = 1;
}
