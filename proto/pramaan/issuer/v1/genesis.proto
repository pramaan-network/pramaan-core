syntax = "proto3";
package pramaan.issuer.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "pramaan/issuer/v1/params.proto";
import "pramaan/issuer/v1/types.proto";

option go_package = "pramaan/x/issuer/types";

// GenesisState defines the issuer module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // issuers contains every registered issuer, needed so state survives export/re-init.
  repeated Issuer issuers = 2;
}
