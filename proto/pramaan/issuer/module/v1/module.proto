syntax = "proto3";
package pramaan.issuer.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "pramaan/x/issuer/types";

// Module is the config object for the module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "pramaan/x/issuer"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
