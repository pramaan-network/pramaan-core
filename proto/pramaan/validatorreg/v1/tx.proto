syntax = "proto3";

package pramaan.validatorreg.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "pramaan/validatorreg/v1/params.proto";

option go_package = "pramaan/x/validatorreg/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  rpc AddValidator(MsgAddValidator) returns (MsgAddValidatorResponse);

  rpc RemoveValidator(MsgRemoveValidator) returns (MsgRemoveValidatorResponse);

  rpc ApplyValidator(MsgApplyValidator) returns (MsgApplyValidatorResponse);

  rpc ApproveValidator(MsgApproveValidator) returns (MsgApproveValidatorResponse);

  rpc ActivateValidator(MsgActivateValidator) returns (MsgActivateValidatorResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "pramaan/x/validatorreg/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgAddValidator defines the MsgAddValidator message.
message MsgAddValidator {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2;
  string domain = 3;
}

// MsgAddValidatorResponse defines the MsgAddValidatorResponse message.
message MsgAddValidatorResponse {}

// MsgRemoveValidator defines the MsgRemoveValidator message.
message MsgRemoveValidator {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2;
}

// MsgRemoveValidatorResponse defines the MsgRemoveValidatorResponse message.
message MsgRemoveValidatorResponse {}

message MsgApplyValidator {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string domain = 2;
  string data = 3;
}

message MsgApplyValidatorResponse {}

message MsgApproveValidator {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 proposal_id = 2;
}

message MsgApproveValidatorResponse {}

message MsgActivateValidator {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 proposal_id = 2;
}

message MsgActivateValidatorResponse {}
