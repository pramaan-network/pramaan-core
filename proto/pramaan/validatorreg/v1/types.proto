syntax = "proto3";

package pramaan.validatorreg.v1;

option go_package = "pramaan/x/validatorreg/types";

message Validator {
  string address = 1;
  bool active = 2;
  string domain = 3;
}

message ValidatorProposal {
  uint64 id = 1;
  string applicant = 2;
  string domain = 3;
  string data = 4; // json (KYB future)
  repeated string approvals = 5;
  string status = 6; // PENDING / APPROVED
}
