syntax = "proto3";
package pramaan.validatorreg.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "pramaan/validatorreg/v1/params.proto";
import "pramaan/validatorreg/v1/types.proto";

option go_package = "pramaan/x/validatorreg/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/pramaan/validatorreg/v1/params";
  }

  rpc Validators(QueryValidatorsRequest) returns (QueryValidatorsResponse);

  rpc Proposals(QueryProposalsRequest) returns (QueryProposalsResponse);
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// 🔥 REQUEST (empty)
message QueryValidatorsRequest {}

// 🔥 RESPONSE
message QueryValidatorsResponse {
  repeated string validators = 1;
}

message QueryProposalsRequest {}

message QueryProposalsResponse {
  repeated ValidatorProposal proposals = 1;
}
